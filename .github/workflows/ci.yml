name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法与一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 插件语法检查
        run: python -m py_compile __init__.py

      - name: 生成的节点别名表是否与 tools/ 输出一致
        run: |
          python tools/build_node_table.py
          git diff --exit-code -- __init__.py

      - name: 提交的 manifest / 安装包 / 单文件是否与源码一致
        run: python tools/check_package.py

      - name: 重新生成后文本产物无差异
        run: |
          python tools/build_extension.py
          git diff --exit-code -- blender_manifest.toml dist/bilingual_add_search.py
