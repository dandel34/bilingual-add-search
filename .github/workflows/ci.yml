name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法与一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 插件语法检查
        run: python -m py_compile bilingual_add_search.py

      - name: 生成的节点别名表是否与 tools/ 输出一致
        run: |
          python tools/build_node_table.py
          git diff --exit-code -- bilingual_add_search.py

      - name: 安装包 / manifest / 源码一致性
        run: |
          python tools/build_extension.py
          python tools/check_package.py
