name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布安装包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 打包扩展 zip（版本号取自插件 bl_info）
        run: python tools/build_extension.py

      - name: 校验安装包
        run: python tools/check_package.py

      - name: 创建/更新 Release 并附上 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --title "Bilingual Add Search ${TAG}" \
              --generate-notes
          fi
