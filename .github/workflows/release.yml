name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布安装包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 确定版本 tag（打 tag 触发用 tag 名，手动触发用 manifest 版本）
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('blender_manifest.toml').read_text(encoding='utf-8'))['version'])")"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "将发布: $(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: 打包扩展 zip 与旧版单文件
        run: python tools/build_extension.py

      - name: 校验产物
        run: python tools/check_package.py

      - name: 创建/更新 Release 并附上产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在（例如手动重跑刷新产物）→ 覆盖附件
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Bilingual Add Search ${TAG}" \
              --generate-notes
          fi
